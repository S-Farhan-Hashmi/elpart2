<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Charge Flow • Intelligent EV Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Leaflet styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Charge Flow Theme -->
    <link rel="stylesheet" href="style.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>

    <!-- Full Screen Map -->
    <div id="map"></div>

    <!-- Vignette Overlay -->
    <div class="map-overlay"></div>

    <!-- Floating Antigravity Panel -->
    <aside class="floating-panel">
        <div class="panel-header">
            <div class="title-group">
                <h1>Charge Flow</h1>
                <p>Intelligent Range AI</p>
            </div>
            <span class="badge">Live</span>
        </div>

        <div class="form-group">
            <label for="carModel">Select Vehicle</label>
            <div class="input-container select-wrapper">
                <select id="carModel">
                    <option value="301">Audi e-tron SUV (301 mi)</option>
                    <option value="264">BMW iX (264 mi)</option>
                    <option value="249">BYD E6 (249 mi)</option>
                    <option value="281">Hyundai Kona Electric (281 mi)</option>
                    <option value="292">Jaguar I-Pace (292 mi)</option>
                    <option value="549">Lexus NZ (549 mi)</option>
                    <option value="75">Mahindra e2o (75 mi)</option>
                    <option value="257">Mercedes-Benz EQC (257 mi)</option>
                    <option value="260">MG ZS EV (260 mi)</option>
                    <option value="168">MINI Cooper SE (168 mi)</option>
                    <option value="226">Nissan LEAF (226 mi)</option>
                    <option value="246">Porsche Taycan (246 mi)</option>
                    <option value="262">Tesla Model 3 Std (262 mi)</option>
                    <option value="353">Tesla Model 3 Long (353 mi)</option>
                    <option value="194">Tata Nexon EV (194 mi)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="batteryLevel">Battery Status</label>
            <div class="battery-input-group">
                <div class="input-container" style="flex: 1;">
                    <input id="batteryLevel" type="number" min="0" max="100" value="70" placeholder="%" />
                </div>
                <span class="suffix">%</span>
            </div>
        </div>

        <button id="calculateBtn" class="primary-btn">
            <span>⚡ Initiate Flow</span>
        </button>

        <div class="status-area">
            <div id="status" class="status-msg">
                Syncing with satellite...
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Drivable Range</span>
                    <span id="rangeInfo" class="stat-value">–</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Nearby Chargers</span>
                    <span id="stationInfo" class="stat-value">–</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- App Logic -->
    <script src="script.js"></script>

</body>

</html>
